<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Nexus - Color Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding-bottom: 40px;
        }
        header {
            text-align: center;
            padding: 30px 15px 15px 15px;
        }
        .sub-header {
            font-size: 0.85rem;
            color: #8a99ad;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .credit {
            font-size: 0.95rem;
            color: #a4b0be;
            margin-bottom: 25px;
        }
        .welcome-card {
            background: linear-gradient(135deg, #13223f, #0d172e);
            border: 1px solid #1f3560;
            border-radius: 12px;
            padding: 20px;
            max-width: 1150px;
            margin: 0 auto 25px auto;
            text-align: right;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .welcome-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .welcome-card p {
            font-size: 0.88rem;
            color: #8a99ad;
            line-height: 1.5;
        }
        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .dropdown-box {
            flex: 1;
            min-width: 140px;
            background: #111a2e;
            border: 1px solid #1f3560;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: #fff;
        }
        .search-box {
            flex: 3;
            min-width: 240px;
            background: #111a2e;
            border: 1px solid #1f3560;
            border-radius: 8px;
            padding: 12px 15px;
            color: #a4b0be;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            text-align: right;
            font-size: 0.95rem;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #8a99ad;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .card {
            background: #111a2e;
            border: 1px solid #1f3560;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .color-preview {
            height: 130px;
            width: 100%;
            cursor: pointer;
        }
        .card-body {
            padding: 12px 15px;
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .hex-text {
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .copy-tag {
            background: #192948;
            color: #8a99ad;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .copy-tag:hover {
            background: #243b6b;
            color: #fff;
        }
        .rgb-hsl-text {
            font-size: 0.78rem;
            color: #7b889b;
            margin-top: 2px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ed573;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-header">Coordination Committee • Color Library</div>
        <h1>Anime Nexus</h1>
        <div class="credit">لجنة التنسيق - رند idk</div>

        <div class="welcome-card">
            <h3>مرحباً بك في مكتبة الألوان</h3>
            <p>اكتشف آلاف الدرجات اللونية، وابحث عن اللون الذي يناسب تصميمك. اضغط على أي درجة لنسخ كودها، أو اختر صيغة HEX أو RGB أو HSL.</p>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="dropdown-box">
                <span>▼</span>
                <span>HEX</span>
            </div>
            <div class="dropdown-box" style="flex: 2;">
                <span>▼</span>
                <span>البنفسجي</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث بكود اللون أو اسمه... مثال: #7AB8FF" oninput="filterColors()">
                <span style="color: #6b7c96;">🔍</span>
            </div>
        </div>

        <div class="info-bar">
            <span>COLOR COLLECTION</span>
            <span id="countText">2,700 درجة متاحة</span>
        </div>

        <div class="grid" id="colorGrid">
            <!-- سيتم توليد الألوان برمجياً هنا -->
        </div>
    </div>

    <div class="toast" id="toast">تم النسخ بنجاح!</div>

    <script>
        const colorList = [
            { hex: "#6D56B3", rgb: "109, 86, 179", hsl: "255, 38%, 52%" },
            { hex: "#574294", rgb: "87, 66, 148", hsl: "255, 38%, 42%" },
            { hex: "#423371", rgb: "66, 51, 113", hsl: "255, 38%, 32%" },
            { hex: "#2D234D", rgb: "45, 35, 77", hsl: "255, 38%, 22%" },
            { hex: "#3C277C", rgb: "60, 39, 124", hsl: "255, 52%, 32%" },
            { hex: "#2A1B55", rgb: "42, 27, 85", hsl: "255, 52%, 22%" },
            { hex: "#AA9CD3", rgb: "170, 156, 211", hsl: "255, 38%, 72%" },
            { hex: "#8C79C3", rgb: "140, 121, 195", hsl: "255, 38%, 62%" },
            { hex: "#A592DD", rgb: "165, 146, 221", hsl: "255, 52%, 72%" },
            { hex: "#856CD0", rgb: "133, 108, 208", hsl: "255, 52%, 62%" },
            { hex: "#6545C4", rgb: "101, 69, 196", hsl: "255, 52%, 52%" },
            { hex: "#4F33A3", rgb: "79, 51, 163", hsl: "255, 52%, 43%" },
            { hex: "#B35656", rgb: "179, 86, 86", hsl: "0, 38%, 52%" },
            { hex: "#944242", rgb: "148, 66, 66", hsl: "0, 38%, 42%" },
            { hex: "#2E8B57", rgb: "46, 139, 87", hsl: "146, 50%, 36%" },
            { hex: "#1E90FF", rgb: "30, 144, 255", hsl: "210, 100%, 56%" }
        ];

        const grid = document.getElementById('colorGrid');

        function renderColors(items) {
            grid.innerHTML = '';
            items.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="color-preview" style="background-color: ${c.hex};" onclick="copyText('${c.hex}')"></div>
                    <div class="card-body">
                        <div class="card-row">
                            <button class="copy-tag" onclick="copyText('${c.hex}')">COPY</button>
                            <span class="hex-text">${c.hex}</span>
                        </div>
                        <div class="rgb-hsl-text">RGB ${c.rgb}</div>
                        <div class="rgb-hsl-text">HSL ${c.hsl}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderColors(colorList);

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                const t = document.getElementById('toast');
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 1500);
            });
        }

        function filterColors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = colorList.filter(c => c.hex.toLowerCase().includes(query) || c.rgb.includes(query));
            renderColors(filtered);
        }
    </script>
</body>
</html>
